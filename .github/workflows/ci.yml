name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]  # sur main, le déploiement lance déjà la construction

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: node --test tests/js/engine.test.mjs
