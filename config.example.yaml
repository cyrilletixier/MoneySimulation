# Exemple de configuration. Lancer :  portfolio-sim run --config config.example.yaml

initial_amount: 100000        # somme de départ
start_date: 2005-01-03        # date de départ (les ETF choisis ont de l'historique depuis ~2004)
# end_date: 2025-12-31        # optionnel, défaut = aujourd'hui
step: 1y                      # pas de calcul : 1y, 6m, 1q (trimestre), 1m...
rebalance: true               # true = retour à l'allocation cible à chaque pas ; false = buy & hold
monthly_contribution: 0        # versement mensuel, investi selon l'allocation cible (0 = aucun)
long_history: false           # true = historique reconstitué avant la création des fonds (voir README)
inflation: eu                 # comparer à l'inflation : eu (zone euro, IPCH), us (CPI américain), ou supprimer la ligne

# Allocation cible (en % ou en fractions, somme = 100 %)
allocation:
  us_equity: 30
  eu_equity: 30
  gold: 10
  gov_debt: 10
  bonds: 10
  real_estate: 10
  # bitcoin: 5                 # exemple : ajouter du Bitcoin (la somme doit rester à 100)

# Sources de données par classe d'actifs. Tout est optionnel : seuls les
# actifs que vous voulez changer sont à préciser (voir `portfolio-sim assets`).
assets:
  us_equity:
    provider: yahoo
    symbol: SPY
  eu_equity:
    provider: yahoo
    symbol: EXSA.DE            # iShares STOXX Europe 600 UCITS ETF (EUR)
  # Exemple : immobilier via l'indice Case-Shiller (FRED) plutôt que des REIT
  # real_estate:
  #   provider: fred
  #   symbol: CSUSHPINSA
  # Exemple : vos propres données dans data/MON_FONDS.csv
  # bonds:
  #   provider: csv
  #   symbol: MON_FONDS
